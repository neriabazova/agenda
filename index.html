<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Agenda</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--mute:#677086;--line:#e1e4ea;--accent:#2457d6;--exam:#c62828;--ctx:#e9ecf2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b1f29;--ink:#e8ebf2;--mute:#9aa3b8;--line:#2d3342;--accent:#6c93ff;--exam:#ff6b6b;--ctx:#262b38;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b1f29;--ink:#e8ebf2;--mute:#9aa3b8;--line:#2d3342;--accent:#6c93ff;--exam:#ff6b6b;--ctx:#262b38;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
header{padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0}
.next{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.next{max-width:520px;font-size:13px}
.up{padding:2px 0;cursor:pointer}.up:hover{background:var(--ctx)}
nav{display:flex;gap:6px;padding:0 16px 8px;flex-wrap:wrap}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:12px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.off{opacity:.35}
main{padding:0 16px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));min-width:760px}
.gh{padding:6px;text-align:center;font-weight:600;color:var(--mute);font-size:12px}
.cell{border-top:1px solid var(--line);border-left:1px solid var(--line);min-height:110px;padding:3px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.cell:hover{background:var(--ctx)}
.cell.out{opacity:.35}.cell.today{outline:2px solid var(--accent);outline-offset:-2px}
.dn{font-size:12px;color:var(--mute);display:flex;justify-content:space-between}
.ev{font-size:11px;border-radius:4px;padding:1px 4px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.ex{font-weight:700;background:#c62828;color:#fff;border:2px solid #7f0000;box-shadow:0 0 0 1px #fff inset}
.ev.ex.ent,.exb.ent{background:#6a1b9a;border-color:#38006b}
.exb{background:#c62828;color:#fff;font-weight:700;font-size:11px;border-radius:5px;padding:2px 4px;margin-top:2px;white-space:normal;text-align:left;border:2px solid #7f0000}
.blk.exm{left:0!important;right:0!important;z-index:4;background:#c62828!important;color:#fff!important;border:2px solid #7f0000;box-shadow:0 0 0 1px #fff,0 3px 10px #0006;font-weight:700;font-size:12px;line-height:1.15;padding:2px 5px;white-space:nowrap;text-overflow:ellipsis}
.blk.exm.short{border-width:1px;font-size:11px;line-height:14px;padding:0 4px;box-shadow:none}
.blk.exm.ent{background:#6a1b9a!important;border-color:#38006b}
.col.hasex{background:color-mix(in srgb,#c62828 9%,var(--card))}
.ev.done{opacity:.4;text-decoration:line-through}
.ev.ad{background:#6b7280!important}
.ab{display:none}
.cell.past,.wk .col.past{opacity:.45}
.cell.today{background:color-mix(in srgb,var(--accent) 12%,var(--card));outline-width:3px}
.hoy{display:inline-block;min-width:22px;text-align:center;border-radius:99px;background:var(--accent);color:#fff;padding:0 5px}
.gh.todayh{background:var(--accent);color:#fff;border-radius:8px}
.wk .col.todayc{background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.nowl{position:absolute;left:0;right:0;border-top:2px solid var(--exam);z-index:2;pointer-events:none}
.mk{font-size:10px;line-height:1.2;border-radius:4px;padding:1px 4px;margin:1px 0;font-weight:600;white-space:normal;text-align:left}
.blk.cxl{opacity:.35;text-decoration:line-through}
.blk.done{opacity:.4}.blk.missed{outline:2px dashed var(--exam);outline-offset:-2px}
[draggable=true]{cursor:grab}
.frm label{display:block;margin:8px 0 0;font-size:12px;color:var(--mute)}
.frm input,.frm select{display:block;width:100%;margin-top:2px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.lk{display:flex;gap:6px;align-items:center;margin:2px 0;font-size:12px}.lkn{flex:1;min-width:0}
.lksel{font-size:12px;padding:3px 6px;max-width:100%;margin-top:3px}
button.mini{padding:2px 8px;font-size:12px;min-height:0}
tr.subs td{background:color-mix(in srgb,var(--accent) 6%,var(--card))}
.sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}.sub .nm{flex:1;min-width:140px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
span.nm{border:0;background:none;padding:0}
tr.fail td{background:color-mix(in srgb,var(--exam) 8%,transparent)}
.num{width:80px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.ev.missed{outline:2px dashed var(--exam);outline-offset:-1px}
.note{margin:0 16px 10px;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13px}
.sec{margin:14px 0 4px;font-weight:700}.sec.red{color:var(--exam)}
.row.missed{background:color-mix(in srgb,var(--exam) 8%,transparent)}
.nav2{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.nav2 h2{margin:0;font-size:17px;min-width:170px;text-align:center}
.wk{display:grid;grid-template-columns:44px repeat(7,minmax(110px,1fr));min-width:860px;position:relative}
.wk .col{position:relative;border-left:1px solid var(--line);height:670px}
.wk .hr{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:10px;color:var(--mute)}
.blk{position:absolute;left:2px;right:2px;border-radius:5px;padding:2px 4px;font-size:11px;color:#fff;overflow:hidden;line-height:1.2}
.blk.ctx{left:0;right:50%;opacity:.95}
.blk.ex{border:2px solid var(--exam);font-weight:700}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-size:12px}
.tag{padding:1px 7px;border-radius:99px;font-size:11px;color:#fff}
.dim{color:var(--mute)}
.pan{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--card);border-left:1px solid var(--line);padding:14px;overflow:auto;transform:translateX(105%);transition:.2s;box-shadow:-8px 0 24px #0003;z-index:5}
.pan.open{transform:none}
.row{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.row .t{min-width:92px;font-variant-numeric:tabular-nums;color:var(--mute)}
.bar2{height:8px;border-radius:5px;background:var(--ctx);overflow:hidden}.bar2>div{height:100%}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(118px + env(safe-area-inset-bottom,0px));background:#1d2330;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;font-size:14px;box-shadow:0 6px 24px #0005}#toast.show{opacity:1}
/* ---- vista Día, barra inferior y hoja «Más» ---- */
.strip{display:flex;gap:6px;margin-bottom:10px}
.strip button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;font-size:12px;line-height:1.2}
.strip button b{font-size:15px}.strip button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.strip button.tdy:not(.sel){border-color:var(--accent);color:var(--accent)}
.strip button.xm{border:2px solid var(--exam);background:color-mix(in srgb,var(--exam) 14%,var(--card));font-weight:700}
.nxb{display:flex;gap:10px;align-items:center;border:2px solid var(--exam);background:color-mix(in srgb,var(--exam) 10%,var(--card));border-radius:12px;padding:10px 12px;margin-bottom:10px;cursor:pointer}
.nxb .big{font-size:26px;line-height:1}.nxb b{color:var(--exam)}.nxb .sub2{font-size:12px;color:var(--mute)}
.hxp{font-size:13px;line-height:1.5}.hxp summary{cursor:pointer}.hch{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.hch span{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:8px;padding:4px 10px;min-width:58px}.hch b{font-size:15px;color:var(--accent)}
#bnav,.more{display:none}
.chev{color:var(--mute);font-size:11px}
.dayhd{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
@media (max-width:700px){
 body{font-size:15px;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
 header{padding:10px 12px;gap:8px}header h1{font-size:18px}
 .next{max-width:none;width:100%}
 #next:not(.open) .up:nth-of-type(n+2){display:none}
 nav#tabs{display:none}
 #filters{display:none;padding:0 12px 8px}body.fopen #filters{display:flex}
 main{padding:0 10px 16px}
 .card{padding:10px;border-radius:12px}
 button,select,input{font-size:16px}
 button{padding:9px 14px;min-height:40px}
 .num{width:92px;padding:8px;font-size:16px}
 .frm input,.frm select{padding:10px;font-size:16px}
 .nav2 h2{min-width:0;flex:1;font-size:16px}
 .nav2 button{min-width:44px}
 .row{padding:10px 0}.row .t{min-width:78px;font-size:13px}
 .row input[type=checkbox]{width:24px;height:24px;margin-top:2px}
 .note{margin:0 0 10px}
 /* hoja inferior para el panel del día y los formularios */
 .pan{left:0;right:0;top:auto;bottom:0;width:100%;max-height:88vh;border-left:0;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);box-shadow:0 -10px 40px #0006}
 .pan.open{transform:none}
 .pan::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 10px}
 /* tablas como tarjetas */
 table.nt,table.nt tbody{display:block}
 table.nt tr:has(>th){display:none}
 table.nt tr{display:block;border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:6px 10px;background:var(--card)}
 table.nt td{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;padding:4px 0}
 table.nt td::before{content:attr(data-l);color:var(--mute);font-size:12px;flex:0 0 38%}
 table.nt td:first-child{display:block;font-weight:700}table.nt td:first-child::before,table.nt td[colspan]::before{content:none}
 table.nt td[colspan]{display:block;border-radius:8px;margin:0}
 /* semana y mes caben en la pantalla (toca un día para ver el detalle) */
 .wk{grid-template-columns:26px repeat(7,minmax(0,1fr));min-width:0}
 .wk .hr{font-size:9px}
 .gh{padding:4px 0;font-size:11px}
 .gh .mk{font-size:0;height:5px;padding:0;margin:2px 1px 0}
 .gh .exb{font-size:0;padding:1px 0;margin:2px 1px 0;text-align:center;border-width:1px;background:var(--exam);color:#fff}
 .gh .exb::before{content:"📝 " attr(data-s);font-size:9px;font-weight:800}.gh .exb.ent{background:#7e57c2}.gh .exb.ent::before{content:"📌 " attr(data-s)}
 .gh.exh{background:color-mix(in srgb,var(--exam) 14%,var(--card))}
 .blk{font-size:9px;line-height:1.1;padding:1px 2px;left:1px;right:1px;word-break:break-word}
 .blk b{display:none}
 .blk.ctx{right:1px;opacity:.55}
 .blk.exm{font-size:9px;padding:1px 2px;border-width:1px}
 .blk.exm.short{font-size:9px}
 .grid{grid-template-columns:repeat(7,minmax(0,1fr));min-width:0}
 .cell{min-height:70px;padding:2px;gap:2px}
 .cell .ev{font-size:7px;line-height:9px;height:10px;padding:0 2px;border-radius:3px;border:0;font-weight:600}
 .cell .ev .tm,.cell .ev .fu{display:none}.cell .ev .ab{display:inline}
 .cell .ev.ex{font-size:8px;line-height:11px;height:12px;box-shadow:none;background:var(--exam);color:#fff;border:0;text-align:center;font-weight:800;border-radius:3px}
 .cell .ev.ex.ent{background:#7e57c2}
 .cell.exd{outline:2px solid var(--exam);outline-offset:-2px;background:color-mix(in srgb,var(--exam) 12%,var(--card))}
 .cell .mk{font-size:0;height:5px;padding:0;margin:1px 0}
 .cell .dn{font-size:11px}
 .hoy{min-width:18px;padding:0 3px}
 /* barra inferior */
 #bnav{display:flex;position:fixed;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px;box-shadow:0 6px 24px #0004}
 #bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;padding:6px 0;min-height:56px;font-size:11px;color:var(--mute);border-radius:14px}
 #bnav button i{font-style:normal;font-size:20px;line-height:1.1}
 #bnav button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
 .more{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-radius:18px 18px 0 0;padding:12px 14px calc(108px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px #0006}
 .more.open{display:block}
 .more button{display:block;width:100%;text-align:left;margin:6px 0;padding:12px 14px}
 .more button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
 .more button.on::after{content:"  ← estás aquí";font-weight:500;font-size:12px;opacity:.85}
 .more h4{margin:0 0 6px;color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase}
}
@media (max-width:600px){header h1{font-size:17px}}
</style>

const EFF=T=>{const p=[[5,.75],[6,.88],[7,1],[8,1.18],[9,1.38],[10,1.6]];T=Math.max(5,Math.min(10,T));for(let i=1;i<p.length;i++)if(T<=p[i][0]){const [a,x]=p[i-1],[b,y]=p[i];return x+(y-x)*(T-a)/(b-a)}return 1.6};

 uex.forEach(e=>a.add(e.date));Object.keys(eov).forEach(k=>{a.add(k.split("|")[0]);if(eov[k]&&eov[k].date)a.add(eov[k].date)});

function gapsJ(e0,e1,busy){const iv=busy.filter(x=>x[1]>e0&&x[0]<e1).sort((x,y)=>x[0]-y[0]),m=[];iv.forEach(([a,b])=>{if(m.length&&a<=m[m.length-1][1])m[m.length-1][1]=Math.max(m[m.length-1][1],b);else m.push([a,b])});
 const out=[];let cur=e0;m.forEach(([a,b])=>{a=Math.max(a,e0);b=Math.min(b,e1);if(a-cur>=45)out.push([cur,a]);cur=Math.max(cur,b)});if(e1-cur>=45)out.push([cur,e1]);return out}
function chunksOfJ(g){const out=[];let t=g[0];while(g[1]-t>=45){let dur=Math.min(120,g[1]-t);if(g[1]-t-dur<45)dur=g[1]-t;out.push([t,t+dur]);t+=dur+15}return out}
function chunksFor(d,CTX){const di=DATA.dayinfo[d];if(!di)return[];const busy=di.sb.map(x=>[...x]);

  else if(c.kind=="gimnasio"||c.kind=="personal"||(c.kind=="viaje"&&!c.study))busy.push([c.start,c.end])});

 const ch=[];di.env.forEach(([e0,e1])=>gapsJ(e0,e1,busy).forEach(g=>chunksOfJ(g).forEach(c=>ch.push(c))));
 const out=[];for(const c of ch){if(acc>=di.cap)break;out.push(c);acc+=c[1]-c[0]}return out}

const focusAt=d=>(DATA.focus||[]).find(f=>f.a<=d&&d<=f.b);
function replan(base,nowA){
 const blk=legsEff().filter(l=>!l.study);
 const keep=[];base.forEach(s=>{const e=ab(s.date,s.end);
  if(s.kind=="fijo"||store[key(s)])keep.push({...s,missed:undefined});
  else if(e<=nowA)keep.push({...s,missed:true});
  else if(s.pin&&!blk.some(l=>l.date==s.date&&l.start<s.end&&l.end>s.start))keep.push(s)});   // lo fijado por Neri se queda, salvo que caiga en un viaje sin estudio
 const doneMin={},pinMin={},dayTask={},daySubj={};
 keep.forEach(s=>{if(s.task){dayTask[s.date+"|"+s.task]=(dayTask[s.date+"|"+s.task]||0)+s.end-s.start;if(store[key(s)])doneMin[s.task]=(doneMin[s.task]||0)+s.end-s.start;else if(s.pin&&!s.missed)pinMin[s.task]=(pinMin[s.task]||0)+s.end-s.start}
  if(s.subj&&s.kind!="fijo")(daySubj[s.date]=daySubj[s.date]||new Set()).add(s.subj)});
 const byD={};keep.forEach(s=>(byD[s.date]=byD[s.date]||[]).push(s));
 const ch=[];
 chunkList().forEach(([d,a,b])=>{const d0=ab(d,0);if(d0+b<=nowA)return;
  let lo=a;if(nowA>d0)lo=Math.max(a,Math.ceil((nowA-d0)/15)*15);
  let segs=[[lo,b]];
  (byD[d]||[]).forEach(s=>{const x=s.start-15,y=s.end+15;segs=segs.flatMap(([p,q])=>y<=p||x>=q?[[p,q]]:[[p,Math.min(q,x)],[Math.max(p,y),q]]).filter(([p,q])=>q-p>=30)});
  segs.forEach(([p,q])=>{if(q-p>=30)ch.push([d,p,q])})});
 ch.sort((x,y)=>x[0]<y[0]?-1:x[0]>y[0]?1:x[1]-y[1]);
 const tl=ch.map(c=>[ab(c[0],c[1]),c[2]-c[1]]),starts=tl.map(t=>t[0]),cum=[0];tl.forEach(t=>cum.push(cum[cum.length-1]+t[1]));
 const CUM=t=>{let lo=0,hi=starts.length;while(lo<hi){const m=(lo+hi)>>1;if(starts[m]<t)lo=m+1;else hi=m}return cum[lo]};
 const T=DATA.tasks.map(t=>({...t,total:tt(t),rem:Math.max(0,tt(t)-(doneMin[t.id]||0)-(pinMin[t.id]||0)),d0:doneMin[t.id]||0,placed:0}));
 const out=[],q=ch.map(c=>[...c]);let i=0;
 while(i<q.length){const [d,a,b]=q[i++];const t0=ab(d,a);const cand=[];
  const ints=DATA.dedic[d],f=ints&&ints.find(([s,x,y])=>x<=a&&a<y),dd=ints?(f?f[0]:"-"):null;
  const fo=focusAt(d);      // semana dedicada: solo esa asignatura (y los extras con tope diario)
  for(const t of T){if(t.placed>=t.rem||t0<t.frm||t0>=t.until)continue;if(dd&&t.subj!==dd)continue;
   if(fo&&t.subj!==fo.subj&&!(t.id in fo.ex))continue;
   const ct=dayTask[d+"|"+t.id]||0,left=(t.until-t0)/1440,cl=ints?9999:fo?(t.subj===fo.subj?9999:fo.ex[t.id]):left>2?t.cap:t.cap+180;if(ct>=cl)continue;
   const c0=CUM(Math.max(t.frm,nowAbs())),c1=CUM(t.until);
   const x=c1<=c0?1:Math.max(0,Math.min(1,(CUM(t0)+(b-a)-c0)/(c1-c0)));
   const target=Math.pow(x,t.p)*t.rem,lc=Math.max(30,CUM(t.until)-CUM(t0)),urg=(t.rem-t.placed)/lc;
   if(t.even&&urg<=0.28&&t.placed>target+150)continue;       // ya va adelantado: se deja el hueco libre
   let sc=target-t.placed+(urg>0.28?1000*urg:0);
   if(fo&&t.subj===fo.subj)sc+=120;else if(fo&&!ints&&t.until-t0<3600)sc+=2000;
   cand.push([sc,t.until-t0,t])}
  const reg=new Set(cand.filter(c=>!c[2].id.startsWith("V")).map(c=>c[2].subj));
  for(let j=cand.length-1;j>=0;j--)if(cand[j][2].id.startsWith("V")&&reg.has(cand[j][2].subj))cand.splice(j,1);
  if(!cand.length)continue;
  const subs=daySubj[d]||new Set();let pool=cand.filter(c=>subs.size<4||subs.has(c[2].subj));if(!pool.length)pool=cand;
  pool.sort((x,y)=>y[0]-x[0]||x[1]-y[1]);const t=pool[0][2];
  let b2=b;if(ab(d,b)>t.until)b2=a+(t.until-t0);
  let dur=Math.min(b2-a,t.rem-t.placed);if(fo&&!ints&&t.subj!==fo.subj)dur=Math.min(dur,fo.ex[t.id]-(dayTask[d+"|"+t.id]||0));
  dur=Math.floor(dur/15)*15;if(dur<15)continue;
  const frac=(t.d0+t.placed)/t.total;let det=t.phases[t.phases.length-1][1];for(const [lim,txt] of t.phases){if(frac<lim-1e-9){det=txt;break}}
  out.push({date:d,start:a,end:a+dur,subj:t.subj,name:t.name,detail:det,kind:"estudio",task:t.id});
  t.placed+=dur;dayTask[d+"|"+t.id]=(dayTask[d+"|"+t.id]||0)+dur;(daySubj[d]=daySubj[d]||new Set()).add(t.subj);
  if(b-(a+dur)>=30)q.splice(i,0,[d,a+dur,b])}
 const all=keep.concat(out).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:x.start-y.start);
 return {gen:DATA.gen,sig:sigNow(),at:new Date().toLocaleString("es-ES"),sessions:all,unplaced:T.filter(t=>t.placed<t.rem).map(t=>({name:t.name,subj:t.subj,min:t.rem-t.placed}))}}

 if(!w.length)return h+`<div class="dim">Nada en los próximos 7 días.</div>`;
 w.forEach(e=>{const d=pd(e.date),n=Math.round((d-t0)/864e5),cuando=n==0?"hoy":n==1?"mañana":`en ${n} días`;
  const tag=e.k=="exam"?`<b style="color:var(--exam)">${e.tipo=="entrega"?"ENTREGA":"EXAMEN"}</b> ${SHORT[e.subj]}${e.cierto?"":" (solo si suspendes)"}`:e.k=="admin"?`🔔 ${e.name}`:`<span style="color:${S[e.subj].color}">●</span> ${e.name}`;

 h+=`<div class="col" style="border:0">`;for(let x=6;x<=23;x++)h+=`<div class="hr" style="top:${(x-5.5)*36}px">${x}:00</div>`;h+="</div>";

/* ---- sincronización entre dispositivos: solo en la página publicada (usa la base de datos del artefacto); el HTML local sigue guardando solo en su navegador ---- */
(async function(){
 const KEYS=["neri_done","neri_plan","neri_ovr","neri_notas","neri_cls","neri_tripov","neri_trips","neri_gymov","neri_gym","neri_exn","neri_exl","neri_uex","neri_eov","neri_utk"],TSK="neri_ts";

 if(!db||!window.Storage)return;

    catch(e){dirty.add(k);if(!errShown){errShown=true;toast("No se pudo sincronizar ahora; se reintentará")}

  finally{flushing=false}}

  store=j("neri_done",{});

  exn=j("neri_exn",{});exl=j("neri_exl",null);nst0=j("neri_notas",{});
  uex=j("neri_uex",[]);DATA.exams=DATA.exams.filter(e=>!e.user);uex.forEach(e=>DATA.exams.push({...e,user:true}));
  eov=j("neri_eov",{});applyEov();utk=j("neri_utk",[]);DATA.tasks=DATA.tasks.filter(t=>!t.user);utk.forEach(t=>DATA.tasks.push({...t,user:true}));
  if(!exl){exl={};DATA.exams.forEach(e=>{const d=DEFL[(e.o?e.o.date:e.date)+"|"+e.subj];if(d)exl[exKey(e)]=d.map(p=>({p,g:exn[exKey(e)]!=null?exn[exKey(e)]:null,w:1}))})}
  if(oldPins.length)snap=replan(DATA.sessions.concat(oldPins),nowAbs());
  refresh();document.getElementById("next").innerHTML=upcoming();render()}
 let pending=null;
 function applyRemote(){
  const a=document.activeElement;
  if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){setTimeout(applyRemote,1500);return}   // no interrumpir mientras escribes
  const p=pending;pending=null;if(!p)return;
  applying=true;
  try{Object.keys(p).forEach(k=>{p[k].v==null?rawRem.call(localStorage,k):rawSet.call(localStorage,k,p[k].v);ts[k]=p[k].t||0});saveTs()}catch(e){}
  applying=false;
  try{reloadState()}catch(e){}
  toast("Actualizado desde otro dispositivo")}
 db.collection("agenda").onSnapshot(snp=>{
  const first=!ready,seen=new Set(),ap={};
  snp.docs.forEach(d=>{const k=d.id;if(!KEYS.includes(k))return;const r=d.data()||{};seen.add(k);remote[k]=r;
   const loc=lget(k),lt=ts[k]||0;

   if((r.t||0)>lt){
    if(k==="neri_done"&&lt===0&&loc!=null&&r.v!=null){try{const m=JSON.stringify({...JSON.parse(loc),...JSON.parse(r.v)});ap[k]={v:m,t:Date.now()};dirty.add(k);return}catch(e){}}
    ap[k]={v:r.v,t:r.t||0}}
   else if(ready)dirty.add(k)});
  if(!snp.metadata.fromCache&&!ready){KEYS.forEach(k=>{if(!seen.has(k)&&lget(k)!=null){ts[k]=ts[k]||Date.now();dirty.add(k)}});
   ready=true}
  if(Object.keys(ap).length){pending=Object.assign(pending||{},ap);applyRemote()}
  saveTs();if(dirty.size){clearTimeout(timer);timer=setTimeout(flush,800)}
  if(first&&!snp.metadata.fromCache)toast("Sincronización activa")},
  e=>{toast("Sincronización no disponible ("+((e&&e.code)||"error")+")")});
})();
